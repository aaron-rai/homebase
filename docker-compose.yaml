services:
  db:
    image: postgres:16-alpine
    container_name: homebase_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: homebase
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - homebridge-network
      - proxy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: homebase_ollama
  #   restart: unless-stopped
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   networks:
  #     - homebridge-network
  #     - proxy

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: homebase_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DATABASE_USER}:${DATABASE_PASSWORD}@db:5432/homebase?schema=public
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      # OLLAMA_API_URL: http://ollama:11434
    labels:
      traefik.enable: "true"
      traefik.hostname: homebase
    networks:
      - homebridge-network
      - proxy
    volumes:
      - ./:/app
      - /app/node_modules
      - /app/.next

volumes:
  pgdata:
  ollama_data:

networks:
  homebridge-network:
    driver: bridge
  proxy:
    external: true
    name: proxy
